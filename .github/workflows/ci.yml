name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test src/compress.test.mjs
      - run: node --test src/code-blocks.test.mjs
      - run: node --test src/lang-detect.test.mjs

