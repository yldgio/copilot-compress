name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - name: Build and verify dist
        run: |
          npm run build
          # Verify dist has no local imports
          if grep -q "from './" dist/extension.mjs; then
            echo "❌ dist/extension.mjs contains local imports — build failed"
            exit 1
          fi
          echo "✅ dist/extension.mjs built successfully"

