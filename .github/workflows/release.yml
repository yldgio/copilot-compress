name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify dist has no local src imports
        run: |
          if grep -q "from './" dist/extension.mjs; then
            echo "❌ dist/extension.mjs contains local imports — build failed"
            exit 1
          fi
          echo "✅ dist/extension.mjs is clean"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          generate_release_notes: true
          files: |
            dist/extension.mjs
            package.json
            install.sh
            install.ps1
            README.md
